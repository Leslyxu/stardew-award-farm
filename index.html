:root{

  --shadow:0 1px 2px rgba(28,38,32,.05),0 6px 18px rgba(28,38,32,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px clamp(16px,3vw,40px);
  display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:36px;height:36px;border-radius:9px;display:block}
.brand h1{font-size:16px;font-weight:650;letter-spacing:.4px;margin:0;line-height:1.25}
.brand .sub{font-size:11px;color:var(--muted);margin-top:1px}
.metrics{display:flex;gap:22px;align-items:center;margin-left:6px}
.metric{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.metric b{font-size:21px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1}
.metric span{font-size:11.5px;color:var(--muted)}
.metric.hi b{color:var(--accent)}
.topActions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{font-size:12.5px;padding:8px 13px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-block}
.tb:hover{border-color:var(--accent);text-decoration:none}
.tb.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.primary:hover{background:#264c42}
.tb .ok{font-size:11px;opacity:.8}

.app{padding:20px clamp(16px,3vw,40px) 44px;max-width:1920px;margin:0 auto}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button b{font-weight:650;margin-left:3px;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accent2);color:var(--accent);font-weight:600}
input[type=search]{font-size:12.5px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);outline:none;min-width:210px;flex:0 1 300px}
input[type=search]:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:20px;align-items:start}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sec-head h2{font-size:14px;font-weight:650;margin:0;letter-spacing:.2px}
.sec-head span{font-size:11.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:13px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 15px 13px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;min-height:146px}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(28,38,32,.09);border-color:#cddcd2}
.card.open{border-top:3px solid var(--accent);padding-top:13px}
.card.soon{border-top:3px solid #d9dfd8;padding-top:13px}
.card.joined{background:#f8fbf8}
.c-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.c-tier{font-size:10.5px;font-weight:650;letter-spacing:.5px;color:var(--accent);
  background:var(--accent2);padding:2px 7px;border-radius:5px;white-space:nowrap}
.c-state{font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.c-state.open{color:var(--accent);font-weight:600}
.c-name{font-size:14px;font-weight:650;line-height:1.45;margin:0 0 4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-org{font-size:11.5px;color:var(--muted);line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px}
.c-foot{margin-top:auto;display:flex;align-items:flex-end;gap:8px}
.c-meta{font-size:11.5px;color:var(--muted);line-height:1.5;min-width:0;flex:1}
.c-meta b{display:block;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
.c-meta b.near{color:var(--clay)}
.c-acts{display:flex;gap:5px;flex:none}
.mini{font-size:11.5px;padding:5px 9px;border:1px solid var(--line);background:#fff;
  border-radius:6px;cursor:pointer;color:var(--accent);white-space:nowrap}
.mini:hover{border-color:var(--accent);background:var(--accent2)}
.mini.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:10px 13px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.mrow:hover{border-color:#cddcd2;background:#fbfdfb}
.mrow .n{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .t{font-size:10.5px;color:var(--accent);background:var(--accent2);padding:1px 6px;border-radius:4px;flex:none}
.mrow .d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.empty{font-size:12.5px;color:var(--muted);padding:26px;text-align:center;
  background:#fff;border:1px dashed var(--line);border-radius:12px}

.side{display:flex;flex-direction:column;gap:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:15px 16px}
.panel h3{font-size:12.5px;font-weight:650;margin:0 0 10px;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.panel h3 .k{font-size:10.5px;font-weight:500;color:var(--muted);margin-left:auto}
.panel p{font-size:11.8px;color:var(--muted);margin:0 0 9px;line-height:1.6}
.farm-bar{height:8px;background:#eaf0e9;border-radius:5px;overflow:hidden;margin:6px 0 9px}
.farm-bar i{display:block;height:100%;background:linear-gradient(90deg,#7fae86,var(--accent));width:0;transition:width .3s}
.farm-plots{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}
.plot{width:17px;height:17px;border-radius:5px;background:#eef2ec;display:grid;place-items:center;font-size:11px}
.plot.on{background:var(--accent2)}
.side-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.side-btns button{font-size:11.5px;padding:6px 10px;border:1px solid var(--line);background:#fff;
  border-radius:7px;cursor:pointer;color:var(--accent)}
.side-btns button:hover{border-color:var(--accent);background:var(--accent2)}
details.lib{border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:7px;overflow:hidden}
details.lib:last-child{margin-bottom:0}
details.lib summary{cursor:pointer;padding:9px 12px;font-size:12px;font-weight:600;list-style:none;color:var(--ink)}
details.lib summary::-webkit-details-marker{display:none}
details.lib summary::before{content:"+ ";color:var(--accent);font-weight:700}
details.lib[open] summary::before{content:"− "}
details.lib .body{padding:0 12px 12px;border-top:1px solid var(--line)}
.libitem{padding:8px 0;border-bottom:1px solid #f0f3ef;font-size:11.8px;line-height:1.6}
.libitem:last-child{border-bottom:0}
.libitem b{font-weight:650}
.libitem .m{color:var(--muted);font-size:11px}
.gcard{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px;background:#fcfdfb}
.gcard h4{font-size:12px;font-weight:650;margin:0 0 5px}
.gcard p{font-size:11.5px;margin:0 0 4px;color:var(--ink);line-height:1.6}
.gcard ul{margin:3px 0 0;padding-left:16px;font-size:11.5px}
.gcard li{margin-bottom:2px}

/* 弹层：详情 / 知网 */
.mask{position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:50;display:none;
  align-items:center;justify-content:center;padding:24px}
.mask.on{display:flex}
.sheet{background:#fff;border-radius:16px;width:min(880px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.2);padding:24px 26px 26px}
.sheet.narrow{width:min(480px,100%)}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px;font-weight:650;margin:0 0 4px;line-height:1.4}
.sheet-head .m{font-size:12px;color:var(--muted)}
.x{margin-left:auto;border:1px solid var(--line);background:#fff;width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);flex:none}
.x:hover{border-color:var(--accent);color:var(--accent)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px 26px}
.dsec h4{font-size:11px;font-weight:650;color:var(--accent);letter-spacing:.5px;margin:0 0 5px;text-transform:uppercase}
.dsec p,.dsec li{font-size:12.5px;color:var(--ink);margin:0;line-height:1.65}
.dsec ul,.dsec ol{margin:0;padding-left:18px}
.dsec li{margin-bottom:3px}
.dsec.full{grid-column:1/-1}
.dsec .src{font-size:11.5px;color:var(--muted)}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.act{font-size:12.5px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;border-radius:8px;cursor:pointer}
.act.ghost{background:#fff;color:var(--accent)}
.field{display:block;margin-bottom:11px}
.field span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;outline:none;background:#fcfdfb}
.field input:focus{border-color:var(--accent);background:#fff}
.note{font-size:11.8px;color:var(--muted);line-height:1.7;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:0 0 14px}
.note b{color:var(--ink)}
.bm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;line-height:1.5;
  word-break:break-all;background:#f4f7f3;border:1px solid var(--line);border-radius:8px;
  padding:10px;max-height:110px;overflow:auto;margin-top:8px;color:#3c4a40}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c2620;color:#fff;
  padding:10px 17px;border-radius:9px;font-size:12.5px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)}

footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center}
footer a{font-weight:600}

@media(max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
}
@media(max-width:640px){
  .topbar{gap:12px;padding:11px 14px}
  .metrics{width:100%;order:3;gap:18px;margin-left:0}
  .metric b{font-size:18px}
  .topActions{gap:6px}
  .tb{padding:7px 10px;font-size:11.5px}
  .app{padding:16px 13px 36px}
  .grid,.compact{grid-template-columns:minmax(0,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:18px 16px 20px}
  input[type=search]{flex:1 1 100%;min-width:0}
}
</style>
</head>

var _actx=null;
function beep(freq,dur,type){
  try{
    if(!_actx)_actx=new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==="suspended")_actx.resume();
    var o=_actx.createOscillator(),g=_actx.createGain();
    o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(.045,_actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,_actx.currentTime+(dur||.03));
    o.connect(g);g.connect(_actx.destination);o.start();o.stop(_actx.currentTime+(dur||.03));
  }catch(e){}
}
function tap(){
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  beep(660,.03,"sine");
}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.closest&&t.closest("input,textarea,select"))return;
  tap();
},true);

}

var curState="open";
function filt(){
  var q=(document.getElementById("fQ").value||"").trim().toLowerCase();
  return LISTED.filter(function(a){
    if(curState==="open"&&stateOf(a)!=="open")return false;
    if(curState==="soon"&&stateOf(a)!=="soon")return false;
    if(q){
      var hay=[a.name,a.short,a.org,a.orgType,a.subject,a.portal].join(" ").toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}

  document.getElementById("fEnded").textContent=ENDED;
  renderCards(); renderSide(); initCNKI();

  document.querySelectorAll("#segState button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll("#segState button").forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");curState=b.getAttribute("data-st");renderCards();
    });
  });
  document.getElementById("fQ").addEventListener("input",renderCards);

  /* 事件委托：卡片 / 加入 / 通知复制 / 关闭 */
  document.addEventListener("click",function(e){
    var t=e.target; if(!t||!t.closest)return;
    var j=t.closest("[data-join]");
    if(j){ e.stopPropagation(); toggleMine(j.getAttribute("data-join")); return; }
    var o=t.closest("[data-open]");
    if(o){ openDetail(o.getAttribute("data-open")); return; }
    var c=t.closest("[data-copy]");
    if(c){
      var k=c.getAttribute("data-copy");
      copyText(k==="all"?noticeText(false):noticeBy(k),
        k==="all"?"通知全文已复制":(WAY[k]?WAY[k].t:"")+"通知已复制");
      return;
    }
    var x=t.closest("[data-close]");
    if(x){ closeSheet(x.getAttribute("data-close")); return; }
  });
  ["mask","cnkiMask"].forEach(function(id){
    document.getElementById(id).addEventListener("click",function(e){
      if(e.target===this)closeSheet(id);
    });
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){closeSheet("mask");closeSheet("cnkiMask");}
  });
}

function noticeText(onlyStu){
  var L=[];
  var open=LISTED.filter(function(a){return stateOf(a)==="open";});

      L.push((i+1)+". "+a.name+"（"+(TIER[a.tier]||a.tier)+"，"+a.org+"）");
      L.push("   截止："+(a.deadline||"以官方通知为准")+"；报送："+WAY[wayOf(a)].t+"。");
    });
    L.push("");
  }
  block("个人投稿","以下赛事可以本人在官方通道提交。请先看清作品尺寸与原创要求，完成后按通知上传，有问题课间来找我。",g.self);
  block("工作坊","以下赛事由老师统一组织、分组完成，以小组或学校名义报送。想参加的同学课后告诉我，我们会安排创作时间。",g.workshop);
  block("美育成果报送","以下赛事不接收个人单独投稿，学校遴选后统一报送。有意向的同学先把作品交给我，由学校汇总，不要自己投。",g.achv);
  if(!onlyStu){
    block("教师报送","以下为教师本人参加的教研与教学成果类赛事，由老师自行准备，同学们不需要报名。",g.teach);
  }
  L.push("另外还有 "+soon.length+" 项赛事通知尚未发布，日期为预估，我会等官方通知到了再另行说明，现在不用准备。");
  L.push("");
  L.push("材料清单、报名通道和提交步骤都写在网站的「赛事台账」里，点开对应赛事就能看到。报名上有任何不清楚的地方，课后直接来找我。");
  L.push("");
  L.push("　　　　　　　　　　　　　　　美术组　老师");
  return L.join("\n");
}

function libHTML(){
  function box(title,inner){
    return '<details class="lib"><summary>'+title+'</summary><div class="body">'+inner+'</div></details>';
  }
  var h="";
  var kinds={}; RES.forEach(function(r){ var k=r.kind||"其他"; (kinds[k]=kinds[k]||[]).push(r); });
  var resInner=Object.keys(kinds).map(function(k){
    return '<div style="padding:8px 0 4px;font-size:12px;font-weight:600;color:#2f5d50">'+esc(k)+'（'+kinds[k].length+'）</div>'+
      kinds[k].map(function(r){
        return '<div class="libitem"><b>'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+' ↗</a>':esc(r.title))+'</b>'+
          '<div class="m">'+esc(r.scope||"")+' · '+esc(r.where||"")+' · '+esc(r.source||"")+'</div></div>';
      }).join("");
  }).join("");
  h+=box("教研前沿 · "+RES.length+" 条",resInner);
  h+=box("评审专家 · "+PEOPLE.length+" 位",PEOPLE.map(function(p){
    return '<div class="libitem"><b>'+esc(p.name)+'</b> <span class="m">'+esc(p.title||"")+' · '+esc(p.org||"")+'</span>'+
      '<div style="font-size:12px;margin-top:3px">'+esc(p.core||"")+'</div>'+
      (p.todo?'<div class="m">建议：'+esc(Array.isArray(p.todo)?p.todo.join("；"):p.todo)+'</div>':'')+
      (p.url?'<div class="m"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">资料 ↗</a></div>':'')+'</div>';
  }).join(""));
  h+=box("工具箱 · "+TOOLS.length+" 项",TOOLS.map(function(t){
    return '<div class="libitem"><b>'+(t.url?'<a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.name)+' ↗</a>':esc(t.name))+'</b>'+
      '<div class="m">'+esc(t.desc||"")+'</div>'+(t.use?'<div style="font-size:12px">用途：'+esc(t.use)+'</div>':'')+'</div>';
  }).join(""));
  h+=box("深圳头部中学在冲什么 · "+BIG_SCHOOLS.length+" 所",BIG_SCHOOLS.map(function(b){
    return '<div class="libitem"><b>'+esc(b.name)+'</b> <span class="m">'+esc(Array.isArray(b.city)?b.city.join("/"):(b.city||""))+' · '+esc(b.tag||"")+'</span>'+
      '<div style="font-size:12px">'+esc(b.won||"")+'</div></div>';
  }).join(""));
  h+=box("往届归档 · "+ENDED+" 项（已结束 / 已截稿，不列参赛）",AWARDS.filter(isEnded).map(function(a){
    return '<div class="libitem"><b>'+esc(a.name)+'</b><div class="m">'+esc(TIER[a.tier]||"")+' · '+esc(a.phase||"")+' · '+esc(a.org||"")+'</div></div>';
  }).join(""));
  h+=box("完整功能版还有什么",'<div class="libitem">封面与成长农场、战绩本、我的资料、备料包、邮件预览、参赛通知生成、重点信源、知网入口、评高级教师材料、白名单检索等，全部保留在 <a href="full.html">完整功能版 ↗</a>。</div>');
  return h;
}


</script>
</body>
</html>
