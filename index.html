<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>这周投什么 · 奖杯农场</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
 --ink:#3a2a18; --ink2:#6b5638; --ink3:#a08c6c;
 --line:#4a2f18; --paper:#fdf6e5; --card:#fffdf6;
 --yellow:#ffd964; --green:#cdeaa5; --blue:#c3e2f7; --red:#e05a3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
 background:var(--paper);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 padding:14px 0 0;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(rgba(74,47,24,.045) 1px,transparent 1px);
 background-size:14px 14px;
}
main{max-width:520px;margin:0 auto;padding:0 16px 0}

/* 顶部插画 */
.banner{position:relative;border:3px solid var(--line);border-radius:16px;overflow:hidden;
 background:#f6ead0;box-shadow:5px 5px 0 rgba(74,47,24,.16);line-height:0}
.banner img{width:100%;height:auto;display:block}
.bar{display:flex;align-items:center;justify-content:space-between;margin:9px 2px 0}
.who{font-size:12.5px;color:var(--ink3);letter-spacing:.02em}
.date{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* 三类切换 */
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 0}
.pk{font:inherit;font-size:11.5px;font-weight:800;color:var(--ink2);background:var(--card);
 border:2.5px solid rgba(74,47,24,.26);border-radius:12px;padding:8px 4px 7px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3;
 box-shadow:2px 2px 0 rgba(74,47,24,.09);transition:transform .1s}
.pk b{font-size:14px;font-weight:900;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:1.2}
.pk.on{background:var(--yellow);border-color:var(--line);box-shadow:3px 3px 0 rgba(74,47,24,.22)}
.pk.on b{color:var(--ink)}
.pk:active{transform:translate(1px,1px)}
.hint{margin:7px 3px 0;font-size:11.5px;color:var(--ink3);line-height:1.45}

/* 小标题 */
.lead{display:flex;align-items:center;gap:7px;margin:12px 2px 8px;
 font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.02em}
.lead::after{content:"";flex:1;height:2px;border-radius:2px;
 background:repeating-linear-gradient(90deg,rgba(74,47,24,.16) 0 5px,transparent 5px 10px)}

/* 主卡 */
.hero{background:var(--yellow);border:3px solid var(--line);border-radius:16px;
 padding:12px 15px 12px;box-shadow:5px 5px 0 rgba(74,47,24,.2)}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.72);
 border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;
 font-size:11.5px;font-weight:700;color:var(--ink)}
.chip .e{display:flex;color:var(--ink)}
.chip .e svg{width:15px;height:15px;stroke-width:2}
.days{display:flex;align-items:baseline;gap:2px;margin:0 0 4px}
.days b{font-size:45px;font-weight:900;line-height:.95;letter-spacing:-.03em;
 font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 rgba(255,255,255,.75)}
.days span{font-size:20px;font-weight:900;margin-left:3px}
.days.rz b{font-size:26px;letter-spacing:0}
.days.rz span{font-size:15px}
.hero h2{margin:0 0 5px;font-size:19px;line-height:1.35;font-weight:800;letter-spacing:-.01em}
.hero .meta{margin:0 0 9px;font-size:12.5px;color:#8a6b34;font-weight:600}
.tl{display:flex;gap:7px;margin:0 0 3px;font-size:13.5px;line-height:1.55;color:#5a4425}
.tl i{font-style:normal;color:#a8863f}
.tl2{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:#8a7135}
.acts{display:grid;grid-template-columns:1fr auto;gap:7px}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;
 font:inherit;font-size:14.5px;font-weight:800;color:#fffdf6;background:var(--line);
 border:0;border-radius:11px;padding:13px 15px;cursor:pointer;
 box-shadow:3px 3px 0 rgba(46,28,12,.35)}
.cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(46,28,12,.35)}
.cta i{display:flex;opacity:.85}
.cta i svg{transition:transform .22s}
.cta.act i svg{transform:rotate(180deg)}
.cta2{width:auto;display:flex;align-items:center;gap:5px;padding:13px 14px;
 background:#fffdf6;color:var(--line);border:2.5px solid var(--line);
 box-shadow:3px 3px 0 rgba(46,28,12,.2)}
.cta2 span{font-size:13px;white-space:nowrap}

/* 次卡 */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.card{border:3px solid var(--line);border-radius:14px;padding:12px 12px 11px;
 font:inherit;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;
 gap:3px;box-shadow:4px 4px 0 rgba(74,47,24,.16);min-height:94px}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(74,47,24,.16)}
.g{background:var(--green)} .b{background:var(--blue)}
.card .e{display:flex;margin-bottom:2px;color:var(--ink2)}
.card .e svg{width:21px;height:21px;color:#3f3018;stroke-width:2}
.card .d{font-size:22px;font-weight:900;line-height:1.05;letter-spacing:-.02em;
 font-variant-numeric:tabular-nums;text-shadow:1.5px 1.5px 0 rgba(255,255,255,.7)}
.card .d small{font-size:11.5px;font-weight:800;margin-left:1px}
.card .d.rz{font-size:13.5px;letter-spacing:0;line-height:1.3;padding:3px 0}
.card .t{font-size:12.5px;line-height:1.4;font-weight:700;color:#4a3a20}
.card .s{font-size:11px;color:#6b5836;margin-top:auto;padding-top:5px;font-weight:600}

/* 其他 */
.more{width:100%;margin:12px 0 0;background:var(--card);border:3px solid var(--line);
 border-radius:13px;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);
 padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
 box-shadow:4px 4px 0 rgba(74,47,24,.13)}
.more u{text-decoration:none;font-size:11px;color:var(--ink3)}
#rest{padding-top:2px}
#rest[hidden],.more[hidden],.duo[hidden],.lead[hidden]{display:none!important}
.row{display:flex;align-items:center;gap:9px;padding:11px 12px;background:var(--card);
 border:2px solid var(--line);border-radius:11px;margin-top:7px;cursor:pointer;
 box-shadow:3px 3px 0 rgba(74,47,24,.1)}
.row .e{display:flex;color:var(--ink2)}
.row .e svg{width:16px;height:16px}
.row .nm{flex:1;font-size:13.5px;line-height:1.4;color:var(--ink);font-weight:600}
.row .dd{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-weight:700;
 font-variant-numeric:tabular-nums}
.row .dd.hot{color:var(--red)}

/* 我的作品箱 */
.boxbtn{width:100%;margin:14px 0 0;display:flex;align-items:center;gap:10px;
 background:var(--card);border:3px solid var(--line);border-radius:13px;padding:11px 13px;
 font:inherit;text-align:left;cursor:pointer;box-shadow:4px 4px 0 rgba(74,47,24,.13);color:inherit}
.boxbtn .e{display:flex;color:var(--ink2)}
.boxbtn .e svg{width:20px;height:20px;stroke-width:2}
.boxbtn b{display:block;font-size:13.5px;font-weight:800;color:var(--ink)}
.boxbtn i{display:block;font-style:normal;font-size:11px;color:var(--ink3)}
.boxbtn u{margin-left:auto;text-decoration:none;color:var(--ink3);font-size:17px}
.paperbtn{text-decoration:none;margin-top:8px;background:#eaf5fc;border-color:rgba(74,47,24,.55)}
.paperbtn .e{color:#2b6f95}

/* 明细 */
.det{background:#fffdf6;border:2px dashed rgba(74,47,24,.35);border-radius:11px;
 padding:2px 12px 8px;margin:2px 0 8px}
.det .r{display:flex;gap:9px;padding:7px 0;border-top:1px dashed rgba(74,47,24,.14);font-size:12.5px;line-height:1.7}
.det .r:first-child{border-top:0}
.det .r b{flex:0 0 46px;color:var(--ink3);font-weight:700}
.det .r span{flex:1;color:var(--ink2);word-break:break-word}
.det .r span a{color:#b4531f}
.hero .det{background:rgba(255,255,255,.82);border-color:rgba(74,47,24,.3);margin-top:11px;margin-bottom:0}

.end{height:20px}
.msgw{padding:14px 0 0;text-align:center}
.msgw button{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);
 background:var(--card);border:2px solid rgba(74,47,24,.28);border-radius:999px;
 padding:8px 16px;cursor:pointer;box-shadow:2px 2px 0 rgba(74,47,24,.1)}

/* 浮层 */
#mask{position:fixed;inset:0;background:rgba(58,42,24,.45);display:none;z-index:70}
#mask.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fffdf6;border-top:3px solid var(--line);
 border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;z-index:80;padding:18px 18px 26px;display:none}
#sheet.on{display:block}
#sheet h3{margin:0 0 3px;font-size:16.5px;font-weight:800;line-height:1.4}
#sheet .sub{margin:0 0 4px;font-size:12px;color:var(--ink3)}
#sheet textarea{width:100%;min-height:220px;font:12.5px/1.85 inherit;color:var(--ink2);
 padding:11px;border:2px solid var(--line);border-radius:11px;resize:vertical;background:#fff}
#sheet .cp{margin-top:10px;width:100%;font:inherit;font-size:14px;font-weight:800;
 background:var(--line);color:#fffdf6;border:0;border-radius:11px;padding:13px;cursor:pointer;
 box-shadow:3px 3px 0 rgba(46,28,12,.3)}
.pkb .lb{margin:15px 0 6px;font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.04em}
.pkb ol{margin:0;padding-left:19px;font-size:13px;line-height:1.85;color:var(--ink2)}
.pkb ol li{margin-bottom:3px;word-break:break-word}
.nmc{font-size:12.5px;font-weight:700;background:var(--yellow);border:2px dashed rgba(74,47,24,.42);
 border-radius:9px;padding:8px 10px;word-break:break-all;line-height:1.5}
.wh{font-size:12.5px;color:var(--ink2);line-height:1.6;word-break:break-word}
.wh a{color:#b4531f}
.box p{margin:0 0 10px;font-size:13px;line-height:1.75;color:var(--ink2)}
.box .n{display:flex;gap:9px;margin:0 0 11px;font-size:13px;line-height:1.65;color:var(--ink2)}
.box .n b{flex:0 0 15px;color:#b4531f;font-weight:900}
.box .dl{display:block;margin-top:14px;text-align:center;font:inherit;font-size:13.5px;
 font-weight:800;color:#fffdf6;background:var(--line);border-radius:11px;padding:13px;
 text-decoration:none;box-shadow:3px 3px 0 rgba(46,28,12,.3)}
.bl{display:inline-block;font-size:9px;font-weight:900;line-height:1.4;padding:0 3.5px;
 border-radius:4px;vertical-align:1.5px;margin-right:3px;letter-spacing:.02em}
.bl.g{background:#e8442e;color:#fff}
.bl.s{background:#2f7d4f;color:#fff}
.copyall{display:block;width:100%;margin:9px 0 3px;font:inherit;font-size:13.5px;font-weight:900;
 color:#fffdf6;background:#2f7d4f;border:2.5px solid var(--line);border-radius:13px;padding:11px 8px;
 cursor:pointer;box-shadow:4px 4px 0 rgba(74,47,24,.2);letter-spacing:.01em}
.copyall[hidden]{display:none!important}
.copyall:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(74,47,24,.2)}
.copyall b{font-size:16px;vertical-align:-1px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-12px);
 background:var(--line);color:#fffdf6;font-size:12.5px;font-weight:700;padding:9px 16px;
 border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:360px){.days b{font-size:40px}.hero h2{font-size:17.5px}.pk{font-size:11.5px}}
</style>
</head>

var D={"sz-jyxh-2026":{"id":"sz-jyxh-2026","nm":"深圳市教育学会 2026 年度主题论文","due":"2026-12-15","org":"深圳市教育学会","lv":"市","rows":[["主办","深圳市教育学会（市教育局主管的市级学会）"],["主题","大中小幼一体化培养的育人接力与实践创新。分「学段衔接类」「跨学段类」，小学可写小幼衔接、小初衔接"],["谁能报","市教育学会个人会员；每人限 1 篇，多人联合申报对每位参与人也算 1 篇"],["时间","2026-10-30 至 12-15，逾期或材料不全不受理"],["硬要求","未公开发表；文字重复率 ≤20%；要有真实校本案例（做法+过程+成效+反思），有调研数据、图表更占优"],["交什么","论文正文（按通知附件格式）+ 查重报告，官网在线提交"],["投到哪","szsjyxh.cn →「大中小幼一体化…」主题论文征集专用版块"],["待遇","择优汇编结集、部分作者受邀论坛交流；不收费"],["门槛","必须先是学会个人会员（会费按学会规定），非会员不予受理"],["咨询","廖老师 0755-82248007；余老师 0755-82246534"]],"grp":"self","ch":"官网在线提交","pk":{"mins":"6 小时（分 3 次写）","files":["01_论文正文.docx（8000 字以内，按通知附件格式）","02_查重报告.pdf（重复率 ≤20%）","03_会员证明截图.png"],"name":"论文_姓名_学校_大中小幼一体化","body":"【题目】小幼衔接期美术学习习惯的接力培养——以我校一年级入学前两周为例\n\n【摘要】（200 字左右，四句话：问题—做法—证据—结论）\n一年级新生入学后普遍出现\"不敢下笔、画不满一张纸\"，根因是幼儿园以游戏为主的表达习惯，在小学被\"画得像不像\"的评价打断。我校用\"三张纸\"过渡法（自由涂鸦纸—半结构轮廓纸—完整构图纸），在入学前两周做衔接，并请幼儿园大班老师共同设计第一张纸。开学一个月后，能独立完成一张完整构图的学生由 41% 升到 78%。建议把\"表达连续性\"而非\"技能起点\"作为小幼衔接的评价口径。\n\n【关键词】小幼衔接；美术；学习习惯；评价口径\n\n【正文结构】（8000 字以内，按此五节写）\n一、问题的提出（1200 字）政策背景 + 本校新生入学测查数据\n二、现状与归因（1500 字）三类典型表现 + 3 个学生个案\n三、做法（2500 字）\"三张纸\"过渡法的设计、课时安排、与幼儿园的联合教研\n四、成效与证据（1800 字）前后测对比表、学生作品对比、家长问卷\n五、反思（1000 字）什么问题没解决、下一步怎么改\n\n【必须注意】\n· 未公开发表过（公众号、校刊都算发表，别用旧文）\n· 查重 ≤20%，引用要标\n· 要有真实校本案例：做法 + 过程 + 成效 + 反思，缺一块就掉档\n· 每人限 1 篇；多人联合申报，对每个参与人也算占 1 篇名额"}},"gd-jyxh-essay":{"id":"gd-jyxh-essay","nm":"广东教育学会 年度学术讨论会征文","due":"","org":"广东教育学会","lv":"省","next":"每年 7—9 月","rows":[["主办","广东教育学会（省教育厅主管）"],["时间","每年 7—9 月发通知、暑期截稿（2026 年度已截，等下一轮）"],["硬要求","查重 <20%；如同意推荐知网，另需 AIGC 检测 <30%；每人限 1 篇，须第一作者"],["交什么","附件1 + 论文正文 + 查重报告 + 附件2，Word 版；文件名「论文编号+市+学校+姓名」"],["投到哪","gdjyxh.org.cn 在线缴费并上传，同时寄纸质 2 份 + 发 gdjyxhxs@126.com（三步缺一不可）"],["待遇","一二三等奖；优秀征文推荐《广东教育》《广东教学报》发表，可入知网会议论文集"],["费用","收评审费（会员与非会员不同价）"]],"grp":"self","ch":"官网+邮箱+纸质","pk":{"mins":"下一轮 7 月再动","files":["01_附件1（申报表）","02_论文正文.docx","03_查重报告.pdf","04_附件2","05_纸质 2 份（寄）"],"name":"论文编号+市+学校+姓名","body":"三步缺一不可，少一步就算没交：\n① gdjyxh.org.cn 在线缴费并上传电子稿\n② 寄纸质 2 份 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function days(d){if(!d)return null;var p=String(d).split('-');if(p.length<3)return null;
 var t=new Date();t.setHours(0,0,0,0);var e=new Date(+p[0],+p[1]-1,+p[2]);
 return Math.round((e-t)/86400000)}
function mmdd(d){var p=String(d).split('-');return p[1]+'-'+p[2]}
function linkify(t){
 var s=esc(t),st=[];
 s=s.replace(/https?:\/\/[^\s，。）)"<]+/g,function(m){st.push(m);return ''+(st.length-1)+''});
 s=s.replace(/((?:[a-z0-9-]+\.)+(?:cn|org|com|net)(?:\/[^\s，。）)"<]*)?)/g,
   function(m){st.push('https://'+m);return ''+(st.length-1)+''});
 s=s.replace(/(\d+)/g,function(_,i){
   var u=st[+i];return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'});
 return s
}
var GT={art:'交作品',self:'自己能投',sch:'要学校报',stu:'发给学生'};
var GH={art:'交画、交照片就行，不写论文；多数由学校统一报',
        self:'不盖章、不求人，自己上网就能交',
        sch:'要学校推荐、逐级上报，个人报不了',
        stu:'教育部 5 条 + 广东 2 条，全免费，家长自己报'};
var LEAD={art:['最近的一条','按月份往后排'],self:['这周最急','还能顺手'],sch:['最硬的一块','也要过三道关'],stu:['最近的一条','其余按月份排']};

function byGroup(g){
 var a=Object.keys(D).map(function(k){return D[k]}).filter(function(x){return x.grp===g});
 a.sort(function(x,y){
  var p=days(x.due),q=days(y.due);
  if(p==null&&q==null)return 0;
  if(p==null)return 1;
  if(q==null)return -1;
  if(p<=0&&q>0)return 1;
  if(q<=0&&p>0)return -1;
  return p-q;
 });
 return a;
}
function daysHTML(it,big){
 var n=days(it.due);
 if(n==null) return '<div class="days rz"><b>'+esc(it.next||'待定')+'</b></div>';
 if(n===0) return '<div class="days rz"><b>今天</b><span>截止</span></div>';
 return '<div class="days"><b>'+n+'</b><span>天</span></div>';
}
function detHTML(it){
 var rows=(it.rows||[]).map(function(r){
   return '<div class="r"><b>'+esc(r[0])+'</b><span>'+linkify(r[1])+'</span></div>'}).join('');
 return '<div class="det" style="display:none" id="d-'+it.id+'">'+rows+'</div>'
}
function toggle(id,btn){
 var d=document.getElementById('d-'+id);if(!d)return;
 var on=d.style.display==='none';
 document.querySelectorAll('.det').forEach(function(x){
   if(x!==d&&x.style.display==='block'){x.style.display='none';
     var b=document.querySelector('.js-tog[data-id="'+x.id.slice(2)+'"]');
     if(b&&b.classList.contains('cta'))b.classList.remove('act')}
 });
 d.style.display=on?'block':'none';
 if(btn&&btn.classList.contains('cta'))btn.classList.toggle('act',on)
}
function lvTxt(v){return v==='国'?'国家级':(v==='省'?'省级':(v||'')+'级')}
function blTag(it){return it.bl?'<span class="bl '+(it.bl==='国'?'g':'s')+'">'+esc(it.bl)+'</span>':''}
function stuText(){
 var a=byGroup('stu'),L=['【白名单美术类赛事 · 家长自己报，全程免费】',''];
 a.forEach(function(it,i){
  L.push((i+1)+'｜'+it.nm);
  L.push('　级别：'+(it.bl==='国'?'国家级':(it.bl==='省'?'广东省':'—'))+(it.no?'（白名单第 '+it.no+' 项）':''));
  L.push('　主办：'+it.org);
  L.push('　谁能报：'+(it.who||'小学—高中'));
  L.push('　交什么：'+(it.what||''));
  L.push('　怎么报：'+(it.how||''));
  L.push('　时间：'+(it.next||'以官方通知为准'));
  L.push('');
 });
 L.push('以上都是教育部 / 广东省教育厅公布的白名单赛事，不收报名费，不与升学挂钩。');
 L.push('要寄原件的，提前留一周；建议顺丰或京东，到付件组委会不收。');
 return L.join('\n');
}
function heroHTML(it){
 var n=days(it.due), tl=TLDR[it.id]||['',''], pk=it.pk;
 var meta=(n==null?'':(n===0?'今天截止 · ':mmdd(it.due)+' 截止 · '))+
   esc(it.ch)+' · 交 '+pk.files.length+' 个文件';
 return '<div class="hrow"><span class="chip"><span class="e">'+ico(it.id)+'</span>'+
   lvTxt(it.lv)+' · '+esc(it.org)+'</span></div>'+
  daysHTML(it,1)+
  '<h2>'+esc(SN[it.id]||it.nm)+'</h2>'+
  '<p class="meta">'+meta+'</p>'+
  '<p class="tl"><i>·</i><span>'+esc(tl[0])+'</span></p>'+
  '<div class="acts">'+
   '<button class="cta js-tog" data-id="'+it.id+'"><span>看要求</span><i><svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg></i></button>'+
   '<button class="cta2 js-pk" data-id="'+it.id+'"><span>投稿包</span><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>'+
  '</div>'+detHTML(it);
}
function cardHTML(it,i){
 var n=days(it.due), d;
 if(n==null) d='<span class="d rz">'+esc(it.next||'待定')+'</span>';
 else if(n===0) d='<span class="d rz">今天截止</span>';
 else d='<span class="d">'+n+'<small>天</small></span>';
 return '<button class="card js-tog '+(i%2?'b':'g')+'" data-id="'+it.id+'">'+
  '<span class="e">'+ico(it.id)+'</span>'+d+
  '<span class="t">'+blTag(it)+esc(SN[it.id]||it.nm)+'</span>'+
  '<span class="s">'+esc(it.ch)+'</span></button>'
}
var LANE={'sz-jyxh-2026':'lw','gd-jyxh-essay':'lw','ba-ai-art':'bs','ba-meiyu-school':'bs',
 'ba-bjt-case':'bs','ba-res-2026':'bs','kt-gd':'kt','kt-sz':'kt','kt-ba':'kt',
 'cn-paint-31':'stu','cn-xws':'stu','cn-haiyang':'stu','cn-aiart':'stu',
 'cn-meiyu':'stu','gd-hmqc':'stu','gd-yjhk':'stu',
 'sz-mrpc-art':'art','sz-xsds-art':'art','ba-jzg-art':'art',
 'gd-szhmy-art':'art','gd-wqamz-art':'art'};
function ico(id){return ICON[LANE[id]||'bs']}
var cur='art';
function render(g){
 cur=g||'self';
 var a=byGroup(cur);
 $('#picks').querySelectorAll('.pk').forEach(function(b){
   b.classList.toggle('on',b.getAttribute('data-g')===cur)});
 Object.keys(GT).forEach(function(k){
   var b=$('#picks [data-g="'+k+'"] b');
   if(b) b.textContent=Object.keys(D).filter(function(x){return D[x].grp===k}).length;
 });
 $('#hint').textContent=GH[cur];
 var ca=$('#copyAll');
 if(ca){ca.hidden=(cur!=='stu'); if(cur==='stu')$('#caN').textContent=a.length;}
 $('#lead1').textContent=LEAD[cur][0];
 $('#lead2').textContent=LEAD[cur][1];

 var h=a[0];
 $('#hero').innerHTML=h?heroHTML(h):'';
 var duo=a.slice(1,3);
 $('#duo').innerHTML=duo.map(cardHTML).join('');
 $('#duoDet').innerHTML=duo.map(detHTML).join('');
 $('#lead2').hidden=!duo.length;
 $('#duo').hidden=!duo.length;

 var rest=a.slice(3);
 var btn=$('#moreBtn');
 if(!rest.length){btn.hidden=true;$('#rest').hidden=true;$('#rest').innerHTML=''}
 else{
  btn.hidden=false;
  $('#rest').innerHTML=rest.map(function(it){
    var n=days(it.due);
    var dd=it.next?it.next:(n==null?'待定':(n<0?'已截止':(n===0?'今天截':mmdd(it.due)+' 截')));
    var hot=(n!=null&&n>=1&&n<=14)?' hot':'';
    return '<div class="row js-tog" data-id="'+it.id+'"'+(n!=null&&n<=0?' style="opacity:.55"':'')+'>'+
      '<span class="e">'+ico(it.id)+'</span><span class="nm">'+blTag(it)+esc(SN[it.id]||it.nm)+
      '</span><span class="dd'+hot+'">'+dd+'</span></div>'+detHTML(it);
  }).join('');
  $('#moreTxt').textContent='其余 '+rest.length+' 项';
  $('#moreArr').textContent='展开 ⌄';
 }
}
function openPK(id){
 var it=D[id];if(!it)return;
 var n=days(it.due);
 var sub=(n==null?esc(it.next||'待定'):(n===0?'今天截止':(n>0?'还剩 '+n+' 天 · '+mmdd(it.due)+' 截止':'')))
   +' · 大概 '+esc(it.pk.mins);
 var h='<h3>'+esc(SN[id]||it.nm)+'</h3><p class="sub">'+sub+'</p><div class="pkb">'+
  '<div class="lb">要交这 '+it.pk.files.length+' 个文件</div><ol>'+
  it.pk.files.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ol>'+
  '<div class="lb">文件怎么命名</div><div class="nmc">'+esc(it.pk.name)+'</div>'+
  '<div class="lb">正文 / 表单内容 · 点下面按钮复制</div>'+
  '<textarea id="pkBox" readonly>'+esc(it.pk.body)+'</textarea>'+
  '<button class="cp" id="cpPk">复制这段</button>'+
  '<div class="lb">投到哪</div><div class="wh">'+linkify(firstUrl(it))+'</div>'+
  '</div>';
 $('#sheet').innerHTML=h;
 window.__pkBody=it.pk.body;
 $('#sheet').classList.add('on');$('#mask').classList.add('on');
}
function firstUrl(it){
 var r=(it.rows||[]).filter(function(x){return /投到哪|投递|渠道|入口/.test(x[0])})[0];
 return r?r[1]:(it.pk.files.length?'见上方要求':'');
}
function openBox(){
 var h='<h3>我的作品箱</h3><p class="sub">备一次，后面每个比赛都能直接用</p><div class="box">'+
  '<div class="n"><b>1</b><span><strong>作品原件</strong>——书法 / 水彩 / 摄影 / 课件 / 论文，原图别压缩。手机相册建一个相簿就叫「2026投稿」，全放这。</span></div>'+
  '<div class="n"><b>2</b><span><strong>投稿正文</strong>——每条点「投稿包」，骨架我已经写好了，复制改校名就能交。</span></div>'+
  '<div class="n"><b>3</b><span><strong>报名表 / 授权书</strong>——只有要盖章的才用得上，就是「要学校报」那三项。</span></div>'+
  '<p style="margin-top:14px"><strong>云盘怎么放</strong><br>腾讯微云或腾讯文档建一个文件夹「2026投稿」，<b>一个赛事一个子文件夹</b>，名字就用投稿包里那个命名格式。以后手机上随时能开。</p>'+
  '<p>我也打包了一份，解压后每个赛事一个文件夹，里面是「要求.md」「命名.txt」「正文.txt」和一个空的「作品」夹。</p>'+
  '<a class="dl" href="postpack.zip" download="2026投稿包.zip">下载投稿包（zip）</a>'+
  '</div>';
 $('#sheet').innerHTML=h;
 $('#sheet').classList.add('on');$('#mask').classList.add('on');
}
function openMsg(){
 $('#sheet').innerHTML='<h3>发家长群</h3><p class="sub">照原样发就行，家长看得懂</p>'+
  '<textarea id="msgBox" readonly>'+esc(stuText())+'</textarea>'+
  '<button class="cp" id="cpMsg">复制</button>';
 $('#sheet').classList.add('on');$('#mask').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on');$('#mask').classList.remove('on')}
function cpText(t,okMsg){
 if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(t).then(function(){toast(okMsg)}).catch(fb);
 }else fb();
 function fb(){
   var box=document.querySelector('#sheet textarea');var ok=false;
   if(box){try{box.focus();box.select();box.setSelectionRange(0,99999);ok=document.execCommand('copy')}catch(e){}}
   toast(ok?okMsg:'已选中，长按复制');
 }
}
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('on');
 setTimeout(function(){el.classList.remove('on')},1800)}

document.addEventListener('click',function(e){
 var g=e.target.closest('.pk');
 if(g){render(g.getAttribute('data-g'));return}
 var t=e.target.closest('.js-tog');
 if(t){toggle(t.getAttribute('data-id'),t);return}
 var p=e.target.closest('.js-pk');
 if(p){openPK(p.getAttribute('data-id'));return}
 if(e.target.closest('#moreBtn')){
   var r=$('#rest'),open=r.hidden;r.hidden=!open;
   $('#moreArr').textContent=open?'收起 ⌃':'展开 ⌄';
 }
 if(e.target.closest('#copyAll')){cpText(stuText(),'已复制 '+byGroup('stu').length+' 条，去家长群粘贴');return}
 if(e.target.closest('#boxBtn'))openBox();
 if(e.target.id==='msgBtn')openMsg();
 if(e.target.id==='mask')closeSheet();
 if(e.target.id==='cpMsg')cpText(stuText(),'已复制，去家长群粘贴');
 if(e.target.id==='cpPk')cpText(window.__pkBody||'','已复制，粘到 Word 里改校名');
});
var d=new Date();
$('#dt').textContent=(d.getMonth()+1)+' 月 '+d.getDate()+' 日';
render('art');
</script>
