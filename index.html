<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5138">
<title>美育赛事报名台</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#23221e;--ink2:#57544b;--muted:#8c887c;
 --line:#e7e2d6;--soft:#f4f0e6;--green:#1f5138;--green2:#2d6b4b;--red:#b23c2b}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:15.5px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
 -webkit-text-size-adjust:100%}
a{color:var(--green);text-decoration:none;border-bottom:1px solid rgba(31,81,56,.3)}
a:hover{color:var(--red);border-bottom-color:var(--red)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
 flex:none;vertical-align:-2px}
.ic.lg{width:19px;height:19px}
/* 顶栏 */
header{background:var(--card);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:13px 0}
.hd img{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none}
.hd .tt{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:19px;letter-spacing:.5px;flex:1;min-width:120px}
.roles{display:flex;gap:8px;flex:none}
.roles button{font:inherit;font-size:13.5px;padding:7px 14px;border-radius:7px;cursor:pointer;
 background:transparent;color:var(--ink2);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.roles button.on{background:var(--green);color:#fff;border-color:var(--green)}
/* 身份门 */
#gate{text-align:center;padding:46px 0 56px}
#gate img{width:190px;max-width:56vw;height:auto;border-radius:16px;margin-bottom:20px}
#gate h1{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:27px;font-weight:400;margin:0 0 8px}
#gate p{color:var(--ink2);font-size:15px;margin:0 0 26px}
.gate-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.gate-btns button{font:inherit;font-size:17px;padding:17px 30px;min-width:190px;border-radius:10px;cursor:pointer;
 background:var(--green);color:#fff;border:1px solid var(--green);display:flex;align-items:center;justify-content:center;gap:9px}
.gate-btns button.tea{background:var(--card);color:var(--green)}
/* 主体 */
main{display:none;padding:24px 0 30px}
main.on{display:block}
.h2{display:flex;align-items:center;gap:9px;font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;
 font-size:21px;font-weight:400;margin:0 0 14px}
.h2 .cnt{font-family:inherit;font-size:13px;color:var(--muted);margin-left:auto;font-weight:400;display:flex;align-items:center;gap:5px}
.statline{display:flex;align-items:center;gap:22px;flex-wrap:wrap;color:var(--ink2);font-size:14.5px;
 background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.statline b{color:var(--green);font-size:16px}
.statline .d{color:var(--red);font-weight:600}
.bigacts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.bigacts button{font:inherit;font-size:15px;padding:12px 20px;border-radius:9px;cursor:pointer;font-weight:600;
 display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:1px solid var(--green)}
.bigacts button.alt{background:var(--card);color:var(--green)}
/* 档案 */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 26px}
.pcard .ph{display:flex;align-items:center;gap:9px;margin-bottom:12px;color:var(--green);
 font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 14px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.grid input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
 border-radius:7px;background:#fff;color:var(--ink)}
.grid input:focus{outline:2px solid var(--green2);border-color:var(--green2)}
button.act{font:inherit;font-size:15px;padding:10px 20px;border-radius:8px;cursor:pointer;
 background:var(--green);color:#fff;border:1px solid var(--green)}
button.mini{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;
 background:var(--card);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.mini:hover{border-color:var(--green);color:var(--green)}
.saved{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);
 border-radius:8px;padding:11px 14px;font-size:15px;margin-bottom:10px}
.saved b{color:var(--green);font-size:16px}
.saved .kv{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:11px;margin-top:11px;
 border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.frow .lb{display:flex;align-items:center;gap:7px}
.quick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);
 border-radius:8px;padding:10px 13px;margin-top:10px;font-size:14px;color:var(--ink2)}
.quick span{flex:1;min-width:150px}
/* 分类与赛事：用行，不用嵌套卡片 */
.grp{margin:0 0 22px}
.grp .gh{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:2px}
.grp .gh b{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:18px;font-weight:400;color:var(--green)}
.grp .gh .num{font-size:12.5px;color:var(--muted);margin-left:auto}
.ev{padding:16px 2px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .nm{font-size:16.5px;line-height:1.5;font-weight:600;color:var(--ink);margin:0 0 9px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ev .lvl{font-size:12px;color:var(--green);background:var(--soft);border:1px solid var(--line);
 padding:2px 9px;border-radius:20px;font-weight:400;white-space:nowrap}
.meta{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.meta .r{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.meta .r .ic{color:var(--muted);margin-top:3px}
.meta .r .k{color:var(--muted);flex:none}
.meta .r a,.meta .r code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
 color:var(--green);word-break:break-all}
.meta .r .dl{color:var(--red);font-weight:600}
.urow{display:flex;gap:9px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);
 border-radius:8px;padding:9px 11px;margin:0 0 12px}
.urow .ic{margin-top:3px;color:var(--muted)}
.urow code{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
 color:var(--green);word-break:break-all;line-height:1.55}
.urow button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;
 background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none}
.evacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.evacts button.go{font:inherit;font-size:15px;padding:11px 20px;border-radius:8px;cursor:pointer;font-weight:600;
 background:var(--green);color:#fff;border:1px solid var(--green);display:flex;align-items:center;gap:8px}
.evacts .done{font-size:13px;color:var(--green);display:flex;align-items:center;gap:6px}
/* 报名单：本页产出的东西 */
.slip{background:var(--card);border:1px solid var(--green);border-radius:10px;margin:14px 0 2px;overflow:hidden}
.slip .sh{display:flex;align-items:center;gap:9px;background:var(--green);color:#fff;padding:10px 16px;
 font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:16.5px}
.slip .sb{padding:14px 18px 6px}
.slip .line{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:14.5px;border-bottom:1px dashed var(--line)}
.slip .line:last-child{border-bottom:0}
.slip .line .k{color:var(--muted);flex:none;min-width:88px;display:flex;align-items:center;gap:7px}
.slip .line .v{color:var(--ink);word-break:break-all;flex:1;min-width:0}
.slip .line .v a{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.slip .sec{font-size:12.5px;color:var(--green);letter-spacing:1px;margin:12px 0 2px;display:flex;align-items:center;gap:7px}
.slip .foot{display:flex;gap:9px;flex-wrap:wrap;padding:12px 18px 16px}
.slip .foot button{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:7px;cursor:pointer;
 display:flex;align-items:center;gap:7px;background:var(--green);color:#fff;border:1px solid var(--green)}
.slip .foot button.g{background:var(--card);color:var(--green)}
.slip .foot a{font:inherit;font-size:13.5px;padding:8px 14px;border-radius:7px;
 border:1px solid var(--line);color:var(--ink2);display:flex;align-items:center;gap:7px}
.slip .hint{font-size:12.5px;color:var(--muted);padding:0 18px 12px}
/* 折叠区 */
details.bx{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 14px}
details.bx>summary{cursor:pointer;list-style:none;padding:13px 17px;font-size:15px;font-weight:600;
 color:var(--green);display:flex;align-items:center;gap:9px}
details.bx>summary::-webkit-details-marker{display:none}
details.bx>summary .cv{margin-left:auto;transition:.2s}
details.bx[open]>summary .cv{transform:rotate(180deg)}
details.bx>summary em{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
details.bx .bd{padding:2px 17px 16px;font-size:14px;color:var(--ink2)}
.ptext{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;
 padding:13px 15px;font-size:13.5px;line-height:1.85;color:var(--ink2);word-break:break-word;margin:0}
.flist{list-style:none;padding:0;margin:8px 0 0}
.flist li{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.flist li .f{flex:1;min-width:150px;word-break:break-all;color:var(--ink)}
.rec{font-size:13.5px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.tiny{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
th{text-align:left;background:var(--soft);color:var(--ink);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink2)}
tr:last-child td{border-bottom:0}
td.no{font-family:ui-monospace,Menlo,monospace;color:var(--muted);width:48px}
td.nm{color:var(--ink)}
.srcbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.srcbar a{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
 border-radius:7px;padding:7px 12px;font-size:13.5px}
footer{border-top:1px solid var(--line);margin-top:26px;padding:16px 0 40px;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
 padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){
 .wrap{padding:0 15px}
 .hd .tt{font-size:16px}
 .roles button{font-size:12.5px;padding:6px 10px}
 #gate{padding:32px 0 42px}
 #gate img{width:150px}
 #gate h1{font-size:23px}
 .gate-btns button{font-size:16px;padding:15px 20px;min-width:150px}
 .bigacts button{width:100%;justify-content:center}
 .grid{grid-template-columns:1fr}
 .pcard{padding:15px}
 button.act{width:100%}
 .statline{gap:14px}
 .slip .line .k{min-width:76px}
 .slip .foot button,.slip .foot a{flex:1;justify-content:center;min-width:120px}
 .evacts button.go{width:100%;justify-content:center}
}
</style>
</head>

<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>

<symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>

<header><div class="wrap hd">
 <img src="cover.webp" alt="">
 <div class="tt">美育赛事报名台</div>
 <div class="roles">
  <button class="js-role" data-role="stu"><svg class="ic"><use href="#i-user"/></svg>学生家长</button>
  <button class="js-role" data-role="tea"><svg class="ic"><use href="#i-school"/></svg>老师</button>
 </div>
</div></header>

<div class="wrap">
 <section id="gate">
  <img src="cover.webp" alt="土豆骑士小鸡">
  <h1>请先选择身份</h1>
  <p>选一次即记住，下次打开直接进</p>
  <div class="gate-btns">
   <button class="js-role" data-role="stu"><svg class="ic lg"><use href="#i-user"/></svg>我是学生家长</button>
   <button class="js-role tea" data-role="tea"><svg class="ic lg"><use href="#i-school"/></svg>我是老师</button>
  </div>
 </section>

 <main id="main">
  <div class="statline" id="statline"></div>
  <div class="bigacts">
   <button id="tellGo"><svg class="ic"><use href="#i-send"/></svg>一键告诉家长</button>
   <button class="alt" id="cpAll"><svg class="ic"><use href="#i-copy"/></svg>一键复制全部报名信息</button>
  </div>

  <section id="personSec">
   <div class="pcard" id="pcard"></div>
  </section>

  <section id="listSec">
   <div class="h2"><svg class="ic lg"><use href="#i-pin"/></svg>正在报名<span class="cnt" id="listCnt"></span></div>
   <div id="catList"></div>
  </section>

  <details class="bx" id="noticeBox">
   <summary><svg class="ic"><use href="#i-send"/></svg>给家长的通知<em id="noticeEm"></em><svg class="ic cv"><use href="#i-cv"/></svg></summary>
   <div class="bd">
    <div class="ptext" id="ptext"></div>
    <div class="row" style="display:flex;gap:9px;flex-wrap:wrap;margin-top:11px">
     <button class="mini" id="cpNotice2"><svg class="ic"><use href="#i-copy"/></svg>复制通知</button>
     <button class="mini" id="shareNotice"><svg class="ic"><use href="#i-send"/></svg>分享给家长</button>
    </div>
   </div>
  </details>

  <details class="bx" id="fileBox">
   <summary><svg class="ic"><use href="#i-clip"/></svg>文件与记录<em id="pstat"></em><svg class="ic cv"><use href="#i-cv"/></svg></summary>
   <div class="bd">
    <input type="file" id="finput" multiple style="font:inherit;font-size:13.5px;max-width:100%">
    <ul class="flist" id="flist"></ul>
    <div style="margin:14px 0 6px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:7px"><svg class="ic"><use href="#i-check"/></svg>已发起的报名</div>
    <div id="recs"></div>
    <div style="margin-top:12px"><button class="mini" id="expTxt"><svg class="ic"><use href="#i-down"/></svg>导出报名资料</button></div>
   </div>
  </details>

  <details class="bx" id="wlBox">
   <summary><svg class="ic"><use href="#i-award"/></svg>白名单赛事<em id="wlCnt"></em><svg class="ic cv"><use href="#i-cv"/></svg></summary>
   <div class="bd">
    <div class="tw"><table><thead><tr><th>序号</th><th>赛事名称</th><th>面向</th></tr></thead><tbody id="wlBody"></tbody></table></div>

function idb(){return new Promise(function(res,rej){if(DB)return res(DB);

function putWork(f){return idb().then(function(d){return new Promise(function(res,rej){
 var tx=d.transaction('works','readwrite');tx.objectStore('works').add({name:f.name,type:f.type,size:f.size,blob:f,time:Date.now()});
 tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}

 var out=[],tx=d.transaction('works','readonly'),q=tx.objectStore('works').openCursor();

function delWork(id){return idb().then(function(d){return new Promise(function(res,rej){
 var tx=d.transaction('works','readwrite');tx.objectStore('works').delete(id);

  '<span>'+I('cal')+'最近 <span class="d">'+esc(cnDate(dls[0]||''))+'</span> 截止</span>'+
  '<span>'+I('user')+(ROLE==='tea'?'教师视图':'学生家长视图')+'</span>';
 $('#listCnt').innerHTML=I('tag')+list.length+' 项';
 $('#noticeEm').textContent='';
 $('#wlCnt').textContent='';
 $('#wlCnt').textContent='共 '+WL.length+' 项';
 $('#wlBody').innerHTML=WL.map(function(r){return '<tr><td class="no">'+r[0]+'</td><td class="nm">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'}).join('');
 $('#ptext').textContent=parentText();
 SLIP=-1;
 renderP();renderList();renderRecs();renderFiles();updStat();
}

/* 事件 */
document.addEventListener('click',function(ev){
 var t=ev.target;
 var r=t.closest('.js-role');
 if(r){ROLE=r.getAttribute('data-role');localStorage.setItem('hf_role_v56',ROLE);PEDIT=false;beep();render();window.scrollTo(0,0);return}
 var cp=t.closest('[data-cp]');
 if(cp){copy(cp.getAttribute('data-cp'));toast('报名链接已复制');beep();return}
 var sl=t.closest('[data-slip]');
 if(sl){openSlip(+sl.getAttribute('data-slip'));return}
 var scp=t.closest('[data-slipcp]');
 if(scp&&SLIP>=0){copy(slipText(OPEN[SLIP],loadP()));toast('报名单已复制');beep();return}
 var sdl=t.closest('[data-slipdl]');
 if(sdl&&SLIP>=0){var e=OPEN[SLIP],p=loadP()||{};dl('报名单_'+(p.name||'未填')+'_'+e.cat+'.txt',slipText(e,p));toast('报名单已存成文件');beep();return}
 var ag=t.closest('[data-again]');
 if(ag){openSlip(+ag.getAttribute('data-again'));return}
 if(t.id==='tellGo'){tellGo();return}
 if(t.id==='cpAll'){copyAll();beep();return}
 if(t.id==='cpNotice2'){copy(parentText());toast('通知已复制');beep();return}
 if(t.id==='shareNotice'){shareNotice();return}
 if(t.id==='pSave'){
  var p={};fields().forEach(function(f){var el=$('#pf_'+f[0]);p[f[0]]=el?el.value.trim():''});
  if(!p.name){toast('请至少填写姓名');return}
  saveP(p);PEDIT=false;renderP();toast('档案已存本机');beep();return}
 if(t.id==='pEdit'){PEDIT=true;renderP();beep();return}
 if(t.id==='fAdd'){var fi=$('#finput');if(fi){fi.click();beep()}return}
 if(t.id==='expTxt'||t.id==='expTxt2'){expTxt();beep();return}
 if(t.id==='cnkiCp'){copy('知网入口 lib.shutong121.com'+NL+'卡号 18185519'+NL+'密码 396330');toast('知网资料已复制');beep();return}
 if(t.id==='recClear'){localStorage.removeItem('hf_rec_v57');renderRecs();renderList();toast('已清空');return}
 var d=t.closest('[data-dl]');
 if(d){dlWork(+d.getAttribute('data-dl'));beep();return}
 var x=t.closest('[data-del]');
 if(x){delWork(+x.getAttribute('data-del')).then(renderFiles);toast('已删除');beep();return}
});
document.addEventListener('change',function(ev){
 if(ev.target.id==='finput'){
  var fs=Array.prototype.slice.call(ev.target.files||[]);if(!fs.length)return;
  Promise.all(fs.map(putWork)).then(function(){renderFiles();ev.target.value='';toast('已在本机保存 '+fs.length+' 个文件');beep()})
   .catch(function(){toast('保存失败，可改用导出报名资料')});
 }
});
render();
</script>
</body>
</html>
