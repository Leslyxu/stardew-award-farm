<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>美育赛事报名台</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#23221e;--ink2:#57544b;--muted:#8c887c;
 --line:#e7e2d6;--soft:#f4f0e6;--green:#1f5138;--green2:#2d6b4b;--red:#b23c2b}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:15.5px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
 -webkit-text-size-adjust:100%}
a{color:var(--green);text-decoration:none;border-bottom:1px solid rgba(31,81,56,.3)}
a:hover{color:var(--red);border-bottom-color:var(--red)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
 flex:none;vertical-align:-2px}
.ic.lg{width:19px;height:19px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:13px 0}
.hd img{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none}
.hd .tt{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:19px;letter-spacing:.5px;flex:1;min-width:120px}
.roles{display:flex;gap:8px;flex:none}
.roles button{font:inherit;font-size:13.5px;padding:7px 14px;border-radius:7px;cursor:pointer;
 background:transparent;color:var(--ink2);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.roles button.on{background:var(--green);color:#fff;border-color:var(--green)}
#gate{text-align:center;padding:46px 0 56px}
#gate img{width:190px;max-width:56vw;height:auto;border-radius:16px;margin-bottom:20px}
#gate h1{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:27px;font-weight:400;margin:0 0 8px}
#gate p{color:var(--ink2);font-size:15px;margin:0 0 26px}
.gate-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.gate-btns button{font:inherit;font-size:17px;padding:17px 30px;min-width:190px;border-radius:10px;cursor:pointer;
 background:var(--green);color:#fff;border:1px solid var(--green);display:flex;align-items:center;justify-content:center;gap:9px}
.gate-btns button.tea{background:var(--card);color:var(--green)}
main{display:none;padding:24px 0 30px}
main.on{display:block}
.h2{display:flex;align-items:center;gap:9px;font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;
 font-size:21px;font-weight:400;margin:0 0 14px}
.h2 .cnt{font-family:inherit;font-size:13px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:5px}
.statline{display:flex;align-items:center;gap:22px;flex-wrap:wrap;color:var(--ink2);font-size:14.5px;
 background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.statline b{color:var(--green);font-size:16px}
.statline .d{color:var(--red);font-weight:600}
.tell{display:flex;margin:0 0 22px}
.tell button{font:inherit;font-size:16px;padding:14px 26px;border-radius:9px;cursor:pointer;font-weight:600;
 display:flex;align-items:center;gap:9px;background:var(--green);color:#fff;border:1px solid var(--green)}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:0 0 26px}
.pcard .ph{display:flex;align-items:center;gap:9px;margin-bottom:11px;color:var(--green);
 font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 13px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.grid input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
 border-radius:7px;background:#fff;color:var(--ink)}
.grid input:focus{outline:2px solid var(--green2);border-color:var(--green2)}
button.act{font:inherit;font-size:15px;padding:10px 20px;border-radius:8px;cursor:pointer;
 background:var(--green);color:#fff;border:1px solid var(--green)}
button.mini{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;
 background:var(--card);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.mini:hover{border-color:var(--green);color:var(--green)}
.saved{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);
 border-radius:8px;padding:11px 14px;font-size:15px}
.saved b{color:var(--green);font-size:16px}
.saved .kv{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px}
.quick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);
 margin-top:11px;padding-top:11px;font-size:14px;color:var(--ink2)}
.quick span{flex:1;min-width:150px}
.quick a.mini{border-bottom:0}
.grp{margin:0 0 22px}
.grp .gh{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:2px}
.grp .gh b{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:18px;font-weight:400;color:var(--green)}
.grp .gh .num{font-size:12.5px;color:var(--muted);margin-left:auto}
.ev{padding:16px 2px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .nm{font-size:16.5px;line-height:1.5;font-weight:600;color:var(--ink);margin:0 0 9px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.ev .lvl{font-size:12px;color:var(--green);background:var(--soft);border:1px solid var(--line);
 padding:2px 9px;border-radius:20px;font-weight:400;white-space:nowrap}
.meta{display:flex;flex-direction:column;gap:6px;margin:0 0 11px}
.meta .r{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.meta .r .ic{color:var(--muted);margin-top:3px}
.meta .r .k{color:var(--muted);flex:none}
.meta .r .dl{color:var(--red);font-weight:600}
.urow{display:flex;gap:9px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);
 border-radius:8px;padding:9px 11px;margin:0 0 12px}
.urow .ic{margin-top:3px;color:var(--muted)}
.urow a{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
 word-break:break-all;line-height:1.55;color:var(--green)}
.evacts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
a.go{font:inherit;font-size:16px;font-weight:600;padding:12px 26px;border-radius:8px;
 background:var(--green);color:#fff;border:1px solid var(--green);border-bottom:1px solid var(--green);
 display:inline-flex;align-items:center;gap:9px}
a.go:hover{background:var(--green2);color:#fff;border-color:var(--green2)}
.evacts .done{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
details.bx{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 14px}
details.bx>summary{cursor:pointer;list-style:none;padding:13px 17px;font-size:15px;font-weight:600;
 color:var(--green);display:flex;align-items:center;gap:9px}
details.bx>summary::-webkit-details-marker{display:none}
details.bx>summary .cv{margin-left:auto;transition:.2s}
details.bx[open]>summary .cv{transform:rotate(180deg)}
details.bx>summary em{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
details.bx .bd{padding:2px 17px 16px;font-size:14px;color:var(--ink2)}
details.bx .bd .pcard{border:0;padding:0;margin:0}
.ptext{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;
 padding:13px 15px;font-size:13.5px;line-height:1.85;color:var(--ink2);word-break:break-word;margin:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
th{text-align:left;background:var(--soft);color:var(--ink);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink2)}
tr:last-child td{border-bottom:0}
td.no{font-family:ui-monospace,Menlo,monospace;color:var(--muted);width:48px}
td.nm{color:var(--ink)}
.srcbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.srcbar a{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
 border-radius:7px;padding:7px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line);margin-top:26px;padding:16px 0 40px;font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
 padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){
 .wrap{padding:0 15px}
 .hd .tt{font-size:16px}
 .roles button{font-size:12.5px;padding:6px 10px}
 #gate{padding:32px 0 42px}
 #gate img{width:150px}
 #gate h1{font-size:23px}
 .gate-btns button{font-size:16px;padding:15px 20px;min-width:150px}
 .tell button{width:100%;justify-content:center}
 .grid{grid-template-columns:1fr}
 .pcard{padding:15px}
 button.act{width:100%}
 a.go{width:100%;justify-content:center}
}
</style>
</head>

var CATORDER=['绘画创意征集','规范汉字书写','书画摄影','教学设计案例'];
var ROLE=localStorage.getItem('hf_role_v56')||'', PEDIT=false;
var NL=String.fromCharCode(10);
var $=function(s){return document.querySelector(s)};
function I(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2400)}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;o.type='sine';g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.start();o.stop(a.currentTime+.1);setTimeout(function(){a.close&&a.close()},300)}catch(e){}try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function copy(t){window.__lastCopy=t;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){},function(){fallback(t)})}else fallback(t)}
function fallback(t){var i=document.createElement('textarea');i.value=t;i.style.position='fixed';i.style.left='-9999px';document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(i)}
function cnDate(s){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||''));return m?(m[2].replace(/^0/,'')+' 月 '+m[3].replace(/^0/,'')+' 日'):String(s||'')}

function pkey(){return 'hf_person_v57_'+(ROLE||'stu')}
function loadP(){try{return JSON.parse(localStorage.getItem(pkey())||'null')}catch(e){return null}}
function saveP(p){localStorage.setItem(pkey(),JSON.stringify(p))}
function fields(){return ROLE==='tea'
 ? [['name','姓名'],['school','任教学校'],['grade','学科职务'],['phone','联系电话'],['mentor','所在科组']]
 : [['name','姓名'],['school','学校'],['grade','年级班级'],['phone','联系电话'],['mentor','指导老师']]}
function lastOpen(){try{return JSON.parse(localStorage.getItem('hf_last_v60')||'null')}catch(e){return null}}
function renderP(){
 var p=loadP(),box=$('#pcard'),last=lastOpen(),q='',sum=$('#pSummary');
 if(sum)sum.textContent=p&&p.name?('已记住 '+p.name):'可选，填一次就记住';
 if(last&&last.who===ROLE){
  q='<div class="quick">'+I('pin')+'<span>上次点进 '+esc(last.n)+'</span>'+
   '<a class="mini" href="'+esc(last.u)+'" target="_blank" rel="noopener noreferrer" data-last="1">'+I('ext')+'再进报名页</a></div>';
 }
 if(p&&p.name&&!PEDIT){
  box.innerHTML='<div class="ph">'+I('user','lg')+'报名人档案</div>'+
   '<div class="saved"><b>'+esc(p.name)+'</b>'+
   '<span class="kv">'+I('school')+esc(p.school||'')+'</span>'+
   '<span class="kv">'+I('tag')+esc(p.grade||'')+'</span>'+
   '<span class="kv">'+I('phone')+esc(p.phone||'')+'</span>'+
   '<button class="mini" id="pEdit">'+I('edit')+'修改</button></div>'+q;
  return;
 }
 var p2=p||{};
 box.innerHTML='<div class="ph">'+I('user','lg')+'报名人档案</div>'+
  '<div class="grid">'+fields().map(function(f){
   return '<div><label>'+esc(f[1])+'</label><input id="pf_'+f[0]+'" value="'+esc(p2[f[0]]||'')+'" placeholder="'+esc(f[1])+'"></div>'}).join('')+'</div>'+
  '<button class="act" id="pSave">'+I('check')+'记住这个人</button>'+q;
}
function nowList(){return OPEN.map(function(e,i){return {e:e,i:i}}).filter(function(o){return o.e.who===ROLE})}
function renderList(){
 var list=nowList(),html='';
 CATORDER.forEach(function(c){
  var rows=list.filter(function(o){return o.e.cat===c});
  if(!rows.length)return;
  html+='<div class="grp"><div class="gh">'+I('pin','lg')+'<b>'+esc(c)+'</b><span class="num">'+rows.length+' 项</span></div>';
  rows.forEach(function(o){
   var e=o.e,last=lastOpen(),done=last&&last.n===e.name;
   html+='<div class="ev"><div class="nm">'+esc(e.name)+'<span class="lvl">'+esc(e.lvl)+'</span></div>'+
    '<div class="meta">'+
    '<div class="r">'+I('cal')+'<span class="k">截止</span><span class="dl">'+esc(e.dltxt)+'</span></div>'+
    '<div class="r">'+I('app')+'<span class="k">平台</span>'+esc(e.gzh)+'</div>'+
    '<div class="r">'+I('file')+'<span class="k">要交</span>'+esc(e.need)+'</div>'+
    '</div>'+
    '<div class="urow">'+I('link')+'<a href="'+esc(e.apply)+'" target="_blank" rel="noopener noreferrer">'+esc(e.apply)+'</a></div>'+
    '<div class="evacts"><a class="go" href="'+esc(e.apply)+'" target="_blank" rel="noopener noreferrer" data-go="'+o.i+'">'+
    I('ext','lg')+'立即报名</a>'+(done?'<span class="done">'+I('check')+'刚点过</span>':'')+'</div></div>';
  });
  html+='</div>';
 });
 $('#catList').innerHTML=html;
}
function parentText(){
 var list=nowList(),L=['各位家长：','','近期可报名的美育活动按类别列出，报名链接与截止日期如下。',''];
 CATORDER.forEach(function(c){
  var rows=list.filter(function(o){return o.e.cat===c});
  if(!rows.length)return;
  L.push('【'+c+'】');
  rows.forEach(function(o){var e=o.e;
   L.push(e.name);
   L.push('  截止 '+e.dltxt);
   L.push('  报名 '+e.apply);
   L.push('  平台 '+e.gzh);
   L.push('  要交 '+e.need);
   L.push('');
  });
 });
 var p=loadP();L.push('—— '+(p&&p.name?p.name:''));
 return L.join(NL);
}
function shareNotice(){
 var t=parentText();copy(t);$('#ptext').textContent=t;$('#noticeBox').open=true;
 toast('通知已生成，可直接发给家长');
 if(navigator.share){try{navigator.share({title:'美育赛事报名通知',text:t}).catch(function(){})}catch(e){}}
 beep();
}
function render(){
 if(!ROLE){$('#gate').style.display='block';$('#main').classList.remove('on');return}
 $('#gate').style.display='none';$('#main').classList.add('on');
 document.querySelectorAll('.js-role').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-role')===ROLE)});
 var list=nowList(),dls=list.map(function(o){return o.e.dl}).sort();
 $('#statline').innerHTML='<span>'+I('pin')+'现在可报 <b>'+list.length+'</b> 项</span>'+
  '<span>'+I('cal')+'最近 <span class="d">'+esc(cnDate(dls[0]||''))+'</span> 截止</span>'+
  '<span>'+I('user')+(ROLE==='tea'?'教师视图':'学生家长视图')+'</span>';
 $('#listCnt').innerHTML=I('tag')+list.length+' 项';
 $('#wlCnt').textContent='共 '+WL.length+' 项';
 $('#wlBody').innerHTML=WL.map(function(r){return '<tr><td class="no">'+r[0]+'</td><td class="nm">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'}).join('');
 $('#ptext').textContent=parentText();
 renderP();renderList();
}
document.addEventListener('click',function(ev){
 var t=ev.target;
 var r=t.closest('.js-role');
 if(r){ROLE=r.getAttribute('data-role');localStorage.setItem('hf_role_v56',ROLE);PEDIT=false;beep();render();window.scrollTo(0,0);return}
 var g=t.closest('[data-go]');
 if(g){var e=OPEN[+g.getAttribute('data-go')];
  localStorage.setItem('hf_last_v60',JSON.stringify({n:e.name,u:e.apply,who:ROLE,t:Date.now()}));
  renderP();renderList();beep();return}
 var la=t.closest('[data-last]');
 if(la){beep();return}
 if(t.id==='tellGo'||t.id==='shareNotice'){shareNotice();return}
 if(t.id==='pSave'){
  var p={};fields().forEach(function(f){var el=$('#pf_'+f[0]);p[f[0]]=el?el.value.trim():''});
  if(!p.name){toast('请至少填写姓名');return}
  saveP(p);PEDIT=false;renderP();toast('已记住，下次直接点报名');beep();return}
 if(t.id==='pEdit'){PEDIT=true;renderP();beep();return}
});
render();
</script>
