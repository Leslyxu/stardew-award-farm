<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>这周投什么</title>
<style>
:root{
 --ink:#15181f; --ink2:#3d434f; --ink3:#818b9c; --line:#e6e9ef;
 --bg:#f4f5f8; --card:#fff; --dark:#171a21;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 padding:0 0 40px;
 -webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:26px 20px 0}

/* 顶栏 */
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px}
.who{font-size:13px;color:var(--ink3);letter-spacing:.02em}
.dt{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* 小标题 */
.lead{font-size:13px;color:var(--ink3);margin:0 0 10px;letter-spacing:.04em}

/* 主卡 */
.hero{background:var(--dark);color:#fff;border-radius:20px;padding:22px 22px 20px;
 box-shadow:0 10px 30px -14px rgba(20,24,34,.5)}
.overline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.left{font-size:13px;color:#9aa4b6;letter-spacing:.03em}
.left b{color:#fff;font-size:38px;font-weight:700;line-height:1;
 font-variant-numeric:tabular-nums;margin:0 2px;vertical-align:-5px;letter-spacing:-.02em}
.pill{font-size:11.5px;color:#c9d2e2;border:1px solid rgba(255,255,255,.22);
 border-radius:999px;padding:3px 10px;white-space:nowrap}
.hero h2{margin:0 0 6px;font-size:21px;line-height:1.35;font-weight:650;letter-spacing:-.01em}
.hero .meta{margin:0 0 16px;font-size:13px;color:#98a2b4}
.hero .tl{margin:0 0 4px;font-size:14.5px;color:#e7ebf2;line-height:1.6}
.hero .tl2{margin:0 0 18px;font-size:14.5px;color:#98a2b4;line-height:1.6}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;
 font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:#fff;
 border:0;border-radius:12px;padding:13px 16px;cursor:pointer}
.cta i{font-style:normal;color:var(--ink3);font-weight:400}

/* 次卡 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:14px 14px 13px;text-align:left;font:inherit;cursor:pointer;color:inherit;
 display:flex;flex-direction:column;gap:3px;min-height:104px}
.card:active{background:#fafbfc}
.card .d{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.card .d.hot{color:#c0392b}
.card .t{font-size:13.5px;color:var(--ink2);line-height:1.45;font-weight:500}
.card .s{font-size:11.5px;color:var(--ink3);margin-top:auto;padding-top:6px}

/* 更多 */
.more{width:100%;margin-top:16px;background:none;border:0;font:inherit;
 font-size:13.5px;color:var(--ink3);padding:14px 4px;cursor:pointer;
 display:flex;align-items:center;justify-content:space-between;
 border-top:1px solid var(--line)}
.more u{text-decoration:none;font-size:11px;color:#aab3c2}

/* 其他区 */
#rest{padding-top:6px}
.grp{margin:18px 0 8px;font-size:12px;color:var(--ink3);letter-spacing:.05em}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff;
 border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.row .nm{flex:1;font-size:14px;line-height:1.45;color:var(--ink2)}
.row .dd{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .dd.hot{color:#c0392b}

/* 明细 */
.det{background:#fff;border:1px solid var(--line);border-radius:12px;
 padding:4px 14px 10px;margin:-2px 0 10px}
.det.on{display:block}
.det>*:first-child{padding-top:10px}
.det .r{display:flex;gap:10px;padding:7px 0;border-top:1px solid #f0f2f6;font-size:13px;line-height:1.7}
.det .r:first-child{border-top:0}
.det .r b{flex:0 0 52px;color:var(--ink3);font-weight:400}
.det .r span{flex:1;color:var(--ink2);word-break:break-word}
.det .r span a{color:#1a56a8}
.hero .det{margin-top:12px;margin-bottom:0;background:#fff}
#duoDet .det{margin-top:2px}

/* 话术 */
.msgw{margin-top:30px;text-align:center}
.msgw button{font:inherit;font-size:12.5px;color:#9aa3b2;background:none;border:0;
 padding:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
 text-decoration-color:#d4d9e2}

/* 浮层 */
#mask{position:fixed;inset:0;background:rgba(12,15,22,.4);display:none;z-index:70}
#mask.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
 max-height:84vh;overflow:auto;z-index:80;padding:20px 20px 28px;display:none}
#sheet.on{display:block}
#sheet h3{margin:0 0 4px;font-size:16px;font-weight:650}
#sheet p{margin:0 0 14px;font-size:12.5px;color:var(--ink3)}
#sheet textarea{width:100%;min-height:300px;font:13.5px/1.85 inherit;color:var(--ink2);
 padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical;background:#fcfcfd}
#sheet .cp{margin-top:12px;width:100%;font:inherit;font-size:14px;font-weight:600;
 background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px;cursor:pointer}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-12px);
 background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:999px;
 opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:360px){.left b{font-size:32px}.hero h2{font-size:19px}}
</style>
</head>

 var tl=TLDR[it.id]||['',''];
 var out='<div class="overline"><div class="left">剩 <b>'+n+'</b> 天</div>'+
  '<span class="pill">'+esc(it.lv)+'级 · '+esc(SHORT[it.org]||it.org.replace(/（.*?）/g,''))+'</span></div>'+
  '<h2>'+esc(it.nm)+'</h2>'+
  '<p class="meta">'+mmdd(it.due)+' 截止</p>'+
  '<p class="tl">'+esc(tl[0])+'</p><p class="tl2">'+esc(tl[1])+'</p>'+
  '<button class="cta js-tog" data-id="'+it.id+'"><span>看 6 行要求</span><i>→</i></button>'+
  detHTML(it);
 return out;
}
function render(){
 var d=new Date();var M=d.getMonth()+1,D=d.getDate();
 $('#dt').textContent=M+' 月 '+D+' 日';
 var list=inPlay().filter(function(x){return x.__k!=='xs'});
 var hero=list[0], duo=list.slice(1,3), rest=list.slice(3);
 $('#hero').innerHTML=heroHTML(hero);
 $('#duo').innerHTML=duo.map(function(it){
   var n=days(it.due);
   return '<button class="card js-tog" data-id="'+it.id+'">'+
    '<span class="d'+(n<=14?' hot':'')+'">'+n+' 天</span>'+
    '<span class="t">'+esc(it.nm.replace(/^\d{4} (宝安区|深圳市)/,'').replace(/^\./,''))+'</span>'+
    '<span class="s">'+mmdd(it.due)+' 截 <span style="float:right">›</span></span></button>'
 }).join('');
 $('#duoDet').innerHTML=duo.map(function(it){return detHTML(it)}).join('');

 // 其他
 var groups=[['bs','区里其他'],['lw','论文·下一轮'],['kt','课题·按季报'],['xs','学生·只放白名单']];
 var used={};used[hero.id]=1;duo.forEach(function(x){used[x.id]=1});
 var h='';
 groups.forEach(function(g){
   var items=LANES[g[0]].items.filter(function(x){return !used[x.id]});
   items.sort(function(a,b){var x=days(a.due),y=days(b.due);
     if(x==null)return 1;if(y==null)return -1;return x-y});
   if(!items.length)return;
   h+='<div class="grp">'+g[1]+'</div>';
   items.forEach(function(it){
     var n=days(it.due);
     var dd=it.next?it.next:(n==null?'待定':(n<0?'已截止':(n===0?'今天截':mmdd(it.due)+' 截')));
     var hot=(n!=null&&n>=0&&n<=14)?' hot':'';
     h+='<div class="row js-tog" data-id="'+it.id+'"'+(n!=null&&n<1?' style="opacity:.55"':'')+'><span class="nm">'+esc(it.nm)+
        '</span><span class="dd'+hot+'">'+dd+'</span></div>'+detHTML(it);
   });
 });
 $('#rest').innerHTML=h;
 var cnt=document.querySelectorAll('#rest .row').length;
 $('#moreTxt').textContent='其他 '+cnt+' 项 · 课题 / 学生 / 已过';
}
document.addEventListener('click',function(e){
 var t=e.target.closest('.js-tog');
 if(t){var id=t.getAttribute('data-id');toggle(id,t);return}
 if(e.target.id==='moreBtn'||e.target.closest('#moreBtn')){
   var r=$('#rest'),open=r.hidden;r.hidden=!open;
   $('#moreArr').textContent=open?'收起 ⌃':'展开 ⌄';
 }
 if(e.target.id==='msgBtn'){openMsg()}
 if(e.target.id==='mask'){closeSheet()}
 if(e.target.id==='cpMsg'){copyMsg()}
});
function openMsg(){
 var s=$('#sheet');
 s.innerHTML='<h3>发家长群</h3><p>照原样发就行，家长看得懂</p>'+
  '<textarea id="msgBox" readonly>'+esc(MSG)+'</textarea>'+
  '<button class="cp" id="cpMsg">复制</button>';
 s.classList.add('on');$('#mask').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on');$('#mask').classList.remove('on')}
function copyMsg(){
 var t=$('#msgBox');t.focus();t.select();
 var done=function(){toast('已复制，去家长群粘贴')};
 if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(MSG).then(done).catch(fallback);
 }else fallback();
 function fallback(){
   var ok=false;try{t.setSelectionRange(0,99999);ok=document.execCommand('copy')}catch(e){}
   toast(ok?'已复制，去家长群粘贴':'已选中，长按复制');
 }
}
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('on');
 setTimeout(function(){el.classList.remove('on')},1800)}
render();
</script>
</body>
</html>
